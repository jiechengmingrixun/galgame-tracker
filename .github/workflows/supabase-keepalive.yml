# =====================================================================
#   Supabase 防休眠定时 ping（GitHub Actions）
#   功能：Supabase Free Plan 会在 7 天无连接后暂停数据库实例。
#         本工作流每天通过 HTTP 请求访问一次 REST API，
#         模拟"有访问"从而避免实例休眠。
#   配置：
#     在 GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#     SUPABASE_URL    例: https://tdwbjahvsonfoawghmrk.supabase.co
#     SUPABASE_ANON_KEY  例: eyJhbGciOiJIUzI1NiIs...（同项目 .env 里的 VITE_SUPABASE_ANON_KEY）
# =====================================================================

name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 16 * * *'   # 每天 UTC 16:17 = 北京时间次日 00:17 触发
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          echo "Pinging $SUPABASE_URL/rest/v1/"
          for i in 1 2 3; do
            echo "== attempt $i =="
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/")
            echo "HTTP status: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "400" ] || [ "$HTTP_CODE" = "401" ]; then
              echo "✅ Supabase is alive!"
              exit 0
            fi
            if [ "$i" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "❌ Failed to reach Supabase after 3 attempts"
          exit 1
