name: Supabase DB Backup

on:
  schedule:
    - cron: '19 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Generate timestamp & filename
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "dir=galgame-backup-$TS" >> "$GITHUB_OUTPUT"

      - name: Export games table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p "${{ steps.meta.outputs.dir }}"
          echo "URL: $SUPABASE_URL"
          echo "ANON_KEY: ${SUPABASE_ANON_KEY:0:20}..."
          echo "Exporting games table ..."
          
          curl -s \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/games?select=*&limit=50000" \
            -o "${{ steps.meta.outputs.dir }}/games.json"
          
          SIZE=$(stat -c%s "${{ steps.meta.outputs.dir }}/games.json")
          echo "File size: $SIZE bytes"
          
          if [ "$SIZE" = "0" ]; then
            echo "ERROR: Empty response"
            exit 1
          fi
          
          COUNT_ROWS=$(grep -c '"id"' "${{ steps.meta.outputs.dir }}/games.json" || echo "0")
          echo "Games: $COUNT_ROWS entries, $SIZE bytes"
          
          tar -czf "${{ steps.meta.outputs.dir }}.tar.gz" "${{ steps.meta.outputs.dir }}"
          ls -lh "${{ steps.meta.outputs.dir }}.tar.gz"
          echo "Backup complete!"

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame-db-backup-${{ steps.meta.outputs.ts }}
          path: ${{ steps.meta.outputs.dir }}.tar.gz
          retention-days: 30
          compression-level: 0
