# =====================================================================
#   Supabase 数据库定时备份
#   配置（GitHub Secrets）：
#     SUPABASE_HOST        例: aws-0-ap-southeast-1.pooler.supabase.com
#     SUPABASE_PORT        例: 6543
#     SUPABASE_PASSWORD    你的数据库密码
# =====================================================================

name: Supabase DB Backup

on:
  schedule:
    - cron: '19 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:15-alpine
    steps:
      - name: Generate timestamp & filename
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "file=galgame-db-$TS.sql.gz" >> "$GITHUB_OUTPUT"

      - name: Run pg_dump
        env:
          PGDATABASE: postgres
          PGHOST: ${{ secrets.SUPABASE_HOST }}
          PGPORT: ${{ secrets.SUPABASE_PORT }}
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          set -euo pipefail
          apk add --no-cache gzip
          pg_dump \
            --host="$PGHOST" \
            --port="$PGPORT" \
            --username="$PGUSER" \
            --no-comments \
            --no-owner \
            --no-privileges \
            --dbname="$PGDATABASE" | gzip -9 > "${{ steps.meta.outputs.file }}"
          ls -lh "${{ steps.meta.outputs.file }}"

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame-db-backup-${{ steps.meta.outputs.ts }}
          path: ${{ steps.meta.outputs.file }}
          retention-days: 30
          compression-level: 0
