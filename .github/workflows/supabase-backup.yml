name: Supabase DB Backup

on:
  schedule:
    - cron: '19 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:15-alpine
    steps:
      - name: Generate timestamp & filename
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "file=galgame-db-$TS.sql.gz" >> "$GITHUB_OUTPUT"

      - name: Run pg_dump
        env:
          PGDATABASE: postgres
          PGHOST: ${{ secrets.SUPABASE_HOST }}
          PGPORT: ${{ secrets.SUPABASE_PORT }}
          PGUSER: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          set -euo pipefail
          apk add --no-cache gzip bind-tools
          # 强制解析 IPv4 地址（避免 IPv6 不通）
          IPV4=$(getent ahostsv4 "$PGHOST" | head -1 | awk '{print $1}')
          echo "Resolved IPv4: $IPV4"
          pg_dump \
            --hostaddr="$IPV4" \
            --host="$PGHOST" \
            --port="$PGPORT" \
            --username="$PGUSER" \
            --no-comments \
            --no-owner \
            --no-privileges \
            --dbname="$PGDATABASE" | gzip -9 > "${{ steps.meta.outputs.file }}"
          ls -lh "${{ steps.meta.outputs.file }}"

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame-db-backup-${{ steps.meta.outputs.ts }}
          path: ${{ steps.meta.outputs.file }}
          retention-days: 30
          compression-level: 0
