name: Supabase DB Backup

on:
  schedule:
    - cron: '19 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Generate timestamp & filename
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "dir=galgame-backup-$TS" >> "$GITHUB_OUTPUT"

      - name: Fetch all table names
        run: |
          RESPONSE=$(curl -s \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          
          TABLES=$(echo "$RESPONSE" | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            tables = [p.strip('/') for p in data.get('paths', {}).keys() if p != '/']
            print('\n'.join(sorted(set(tables))))
          ")
          
          echo "Tables found:"
          echo "$TABLES"
          echo "$TABLES" > tables.txt

      - name: Export each table as JSON
        run: |
          mkdir -p "${{ steps.meta.outputs.dir }}"
          TABLES=$(cat tables.txt)
          
          for TABLE in $TABLES; do
            echo "Exporting $TABLE ..."
            DATA=$(curl -s \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$TABLE?select=*&limit=50000")
            
            echo "$DATA" > "${{ steps.meta.outputs.dir }}/${TABLE}.json"
            SIZE=$(stat -c%s "${{ steps.meta.outputs.dir }}/${TABLE}.json")
            COUNT_ROWS=$(echo "$DATA" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")
            echo "  -> $TABLE: ${COUNT_ROWS} rows, ${SIZE} bytes"
          done
          
          tar -czf "${{ steps.meta.outputs.dir }}.tar.gz" "${{ steps.meta.outputs.dir }}"
          ls -lh "${{ steps.meta.outputs.dir }}.tar.gz"
          echo "Backup complete!"

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame-db-backup-${{ steps.meta.outputs.ts }}
          path: ${{ steps.meta.outputs.dir }}.tar.gz
          retention-days: 30
          compression-level: 0
