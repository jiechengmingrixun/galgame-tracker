name: Supabase DB Backup

on:
  schedule:
    - cron: '19 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Generate timestamp & filename
        id: meta
        run: |
          TS=$(date +%Y%m%d-%H%M)
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "dir=galgame-backup-$TS" >> "$GITHUB_OUTPUT"

      - name: Export games table
        run: |
          mkdir -p "${{ steps.meta.outputs.dir }}"
          echo "Exporting games table ..."
          DATA=$(curl -s -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/games?select=*&limit=50000")
          HTTP_CODE=$(echo "$DATA" | tail -1)
          BODY=$(echo "$DATA" | sed '$d')
          echo "$BODY" > "${{ steps.meta.outputs.dir }}/games.json"
          SIZE=$(stat -c%s "${{ steps.meta.outputs.dir }}/games.json")
          COUNT_ROWS=$(echo "$BODY" | grep -c '^{"id"')
          if [ "$HTTP_CODE" = "200" ]; then
            echo "  -> games: ${COUNT_ROWS} rows, ${SIZE} bytes"
          else
            echo "  -> games: ERROR (HTTP $HTTP_CODE), ${SIZE} bytes"
          fi
          tar -czf "${{ steps.meta.outputs.dir }}.tar.gz" "${{ steps.meta.outputs.dir }}"
          ls -lh "${{ steps.meta.outputs.dir }}.tar.gz"
          echo "Backup complete!"

      - name: Upload backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame-db-backup-${{ steps.meta.outputs.ts }}
          path: ${{ steps.meta.outputs.dir }}.tar.gz
          retention-days: 30
          compression-level: 0
